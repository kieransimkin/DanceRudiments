<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DanceRudiments motion lab</title><link rel="stylesheet" href="style.css"></head>
<body><main><header class="hero"><p class="eyebrow">INTEGER-PIP MOTION LIBRARY</p><h1>DanceRudiments</h1><p>Rhythmic position functions, sampled exactly once per 1/64-beat pip.</p></header>
<section class="controls" aria-label="Playback controls"><button id="previous" aria-label="Previous pip">−1</button><button id="play">Pause</button><button id="next" aria-label="Next pip">+1</button><label>BPM <input id="bpm" type="number" min="20" max="300" value="100"></label><label>Amplitude <input id="amplitude" type="range" min="8" max="64" value="42"></label><label class="pip-control">Pip <input id="pip" type="range" min="0" max="255" value="0"><strong id="pip-text">0</strong></label></section>
<section id="grid" class="grid" aria-label="Rudiment previews"></section><footer>Offsets are local to each bounded subject. Reduced-motion preferences start the lab paused.</footer></main><script type="module" src="app.js"></script></body></html>
