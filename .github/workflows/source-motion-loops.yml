name: Source-first motion loops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-motion-loops.yml'
      - 'python/dancerudiments_authoring/source_loop_analysis.py'
      - 'tools/analyze_source_motion.py'
      - 'tools/analyze_motion_collection.py'
      - 'tests/python/test_source_loop_analysis.py'
      - 'docs/source-loop-analysis.md'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/source-motion-loops.yml'
      - 'python/dancerudiments_authoring/source_loop_analysis.py'
      - 'tools/analyze_source_motion.py'
      - 'tools/analyze_motion_collection.py'
      - 'tests/python/test_source_loop_analysis.py'
      - 'docs/source-loop-analysis.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-first-loop-analysis:
    name: StemLab motion analysis before native 64-pip compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DANCERUDIMENTS_REQUIRE_NATIVE: '1'
      DANCERUDIMENTS_REQUIRE_STEMLAB: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      TMPDIR: ${{ github.workspace }}/.cache/tmp
      # The pinned StemLab source snapshot is for feature integration regression
      # only; it is not a release dependency or an implicit ML/model download.
      PYTHONPATH: ${{ github.workspace }}/.cache/stemlab-source/src
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch pinned compatible StemLab kinematic source (tests only)
        uses: actions/checkout@v6
        with:
          repository: kieransimkin/stemlab
          ref: e4b440e585748a5177b228e0a50e747787ec9762
          path: .cache/stemlab-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Probe project-local temporary directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, tempfile
          parent = Path(os.environ['TMPDIR'])
          parent.mkdir(parents=True, exist_ok=True)
          with tempfile.TemporaryDirectory(dir=parent) as temporary:
              file = Path(temporary) / 'test'
              file.write_text('source-first')
              assert file.read_text() == 'source-first'
              file.rename(file.with_name('renamed'))
              assert file.with_name('renamed').read_text() == 'source-first'
              file.with_name('renamed').unlink()
          PY
      - name: Install native DanceRudiments and lightweight rig-analysis dependencies
        # StemLab's analysis package currently imports its audio-loop module on
        # package initialisation. soundfile is needed to import the module even
        # though kinematic inference itself requires only NumPy. Do NOT install
        # the heavy StemLab audio/torch/model dependency graph in this job.
        run: python -m pip install '.[motion-import]' 'soundfile>=0.12,<1'
      - name: Fail fast unless the real pinned StemLab analyser is importable
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          from stemlab.analysis.rig_motion import analyze_rig_capture, write_rig_analysis
          expected = Path('.cache/stemlab-source/src/stemlab/analysis/rig_motion.py').resolve()
          actual = Path(inspect.getfile(analyze_rig_capture)).resolve()
          assert actual == expected, (actual, expected)
          assert callable(write_rig_analysis)
          print('Using genuine pinned StemLab kinematic analyser:', actual)
          PY
      - name: Test source capture, real StemLab inference, and native loop previews
        run: python -m unittest discover -s tests/python -p 'test_source_loop_analysis.py' -v
      - name: Exercise full CLI with an original synthetic BVH source
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          p = Path('.cache/synthetic-original.bvh')
          p.parent.mkdir(parents=True, exist_ok=True)
          # A 120-BPM pulse layered over a two-second repeated arm/knee phrase.
          # Two independent moving joints produce real beat-grid evidence rather
          # than a smooth single-channel sine that may have no defensible tempo.
          rows = []
          for i in range(16*60 + 1):
              seconds = i / 60
              arm = (0.85*math.exp(-((seconds % .5 - .12)/.065)**2)
                     + .12*math.sin(math.tau * seconds / 2))
              knee = .10*math.sin(math.tau * seconds / 2 + .4)
              rows.append(' '.join(map(str, (0, 0, 0, 0, 0, 0,
                                               40*arm, 0, 0, 20*knee, 0, 0))))
          p.write_text('HIERARCHY\nROOT Hips\n{\n OFFSET 0 0 0\n'
                       ' CHANNELS 6 Xposition Yposition Zposition Zrotation Xrotation Yrotation\n'
                       ' JOINT Arm\n {\n  OFFSET 0 1 0\n'
                       '  CHANNELS 3 Zrotation Xrotation Yrotation\n'
                       '  End Site\n  {\n   OFFSET 0 1 0\n  }\n }\n'
                       ' JOINT Knee\n {\n  OFFSET 0 -1 0\n'
                       '  CHANNELS 3 Zrotation Xrotation Yrotation\n'
                       '  End Site\n  {\n   OFFSET 0 -1 0\n  }\n }\n'
                       '}\nMOTION\n'
                       'Frames: 961\nFrame Time: 0.016666666666666666667\n'
                       + '\n'.join(rows) + '\n')
          PY
          python tools/analyze_source_motion.py .cache/synthetic-original.bvh \
            --output-dir .cache/source-loop-smoke --max-previews 2 --verify-native
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.cache/source-loop-smoke/job.json').read_text())
          assert report['source_kind'] == 'original_bvh_or_blender_capture'
          assert report['source_original_sha256']
          assert report['profile_sha256']
          assert report['preview_count'] > 0, 'Synthetic source produced no usable loops'
          stemlab = json.loads(Path('.cache/source-loop-smoke/stemlab-analysis.json').read_text())
          assert stemlab['recommended_tempo'], 'Synthetic source produced no tempo estimate'
          assert stemlab['loop_candidates'], 'Synthetic source produced no loop hypotheses'
          assert all(item['native_samples_verified'] for item in report['previews'])
          assert all(not item['audio_beat_alignment_verified'] for item in report['previews'])
          PY
      - name: Analyse a reviewed cached synthetic source collection without downloads
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path('.cache')
          original = root / 'synthetic-original.bvh'
          archive = root / 'synthetic-motion.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as handle:
              handle.write(original, arcname='synthetic/dance.bvh')
          source = {'id': 'synthetic', 'title': 'Synthetic fixture',
                    'source_url': 'https://example.invalid/synthetic',
                    'license': {'id': 'MIT', 'attribution': 'Synthetic CI fixture'},
                    'conversion': {'unit_scale': 1., 'axis_forward': '-Z', 'axis_up': 'Y'},
                    'archives': [{'cache_path': 'synthetic-motion.zip',
                                  'size_bytes': archive.stat().st_size,
                                  'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
                                  'group': 'test'}]}
          (root/'synthetic-motion-plan.json').write_text(json.dumps({
              'format': 'dancerudiments.motion-source-plan',
              'schema_version': 1, 'sources': [source]}))
          PY
          python tools/analyze_motion_collection.py \
            --plan .cache/synthetic-motion-plan.json \
            --sources synthetic --cache-root .cache \
            --output-root .cache/source-loop-collection-smoke \
            --max-actions 1 --max-previews 2 --verify-native
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.cache/source-loop-collection-smoke')
          report = json.loads((root/'index.json').read_text())
          assert report['analysed_action_count'] == 1, report
          assert report['failed_action_count'] == 0, report
          assert not report['truncated']
          action = report['actions'][0]
          assert action['source_sha256']
          assert action['preview_count'] > 0, 'Batch source yielded no native loop previews'
          assert (root/action['relative_output']/'stemlab-analysis.json').is_file()
          PY
      - name: Preserve synthetic source-first evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-first-loop-synthetic-evidence
          path: |
            .cache/source-loop-smoke/
            .cache/source-loop-collection-smoke/
          if-no-files-found: warn
          retention-days: 7
