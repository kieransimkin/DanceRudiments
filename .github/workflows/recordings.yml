name: Recording harness and native compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DANCERUDIMENTS_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build and install actual native/authoring package
        run: |
          python -m pip install . playwright
          python -m playwright install --with-deps chromium
      - name: Check committed sampler/source hashes and shared package APIs
        run: |
          python -m unittest discover -s tests/python -p test_recording.py -v
          python -m unittest discover -s tests/python -p test_harness_display.py -v
      - name: Check unchanged beat-player contracts after moving shared assets
        run: node --test tests/typescript/beat-player.test.js
      - name: Rebuild the generic native recording accessor
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python tools/build_recording_wasm.py
      - name: Native C++ recording and existing-pattern regressions
        run: |
          cmake -S . -B build-recordings -DCMAKE_BUILD_TYPE=Release
          cmake --build build-recordings --parallel 2
          ctest --test-dir build-recordings --output-on-failure
      - name: Verify a freshly built recording page with real local-file loading
        env:
          PYTHONPATH: python
        run: python tools/test_recording_harness.py recording-harness/index.html --make-fixture --screenshot recording-comparison.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-recording-harness
          path: |
            recording-harness/
            recording-comparison.png
            recording-comparison-bars.png
          if-no-files-found: warn
