name: Kandi Boom asset and rig QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kandi-boom-validation.yml'
      - 'harness/kandi-boom/**'
      - 'tools/audit_kandi_boom.py'
      - 'tools/kandi_boom_fbx.py'
      - 'tools/test_kandi_boom_browser.py'
      - 'tests/python/test_kandi_boom_*'
      - 'tools/build_mesh_demo.mjs'
      - 'tools/mesh_demo_assets/**'
      - 'tools/test_mesh_demo_browser.py'
      - 'tests/typescript/kandi-boom.test.js'
  pull_request:
    paths:
      - '.github/workflows/kandi-boom-validation.yml'
      - 'harness/kandi-boom/**'
      - 'tools/audit_kandi_boom.py'
      - 'tools/kandi_boom_fbx.py'
      - 'tools/test_kandi_boom_browser.py'
      - 'tests/python/test_kandi_boom_*'
      - 'tools/build_mesh_demo.mjs'
      - 'tools/mesh_demo_assets/**'
      - 'tools/test_mesh_demo_browser.py'
      - 'tests/typescript/kandi-boom.test.js'

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify committed source rig and asset digest
        run: |
          python tools/audit_kandi_boom.py \
            --assets harness/kandi-boom/assets \
            --output harness/kandi-boom/rig-audit.json \
            --source-rig-output harness/kandi-boom/source-rig.json \
            --check
      - name: Audit regression suite
        run: python -m unittest discover -s tests/python -p 'test_kandi_boom_*.py' -v

  browser-preview:
    needs: source-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install existing locked Three.js dependency
        run: npm ci --ignore-scripts
      - name: Verify production Kandi gallery wiring
        run: |
          node --check tools/mesh_demo_assets/kandi-boom.js
          node --check tools/mesh_demo_assets/app.js
          node --check tools/build_mesh_demo.mjs
          node --test tests/typescript/kandi-boom.test.js
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Screenshot and smoke-test the standalone FBX viewer
        run: python tools/test_kandi_boom_browser.py --output-dir generated/kandi-browser-qa
      - name: Preserve browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kandi-boom-browser-qa
          path: generated/kandi-browser-qa/
          if-no-files-found: warn
