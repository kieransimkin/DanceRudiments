name: Release demo
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag containing the demo-rendering tools'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-demo-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate the tag and source version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          python tools/release_version.py verify-tag "$RELEASE_TAG"
          echo "DEMO_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "DEMO_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify generated packs and default registration
        run: |
          python tools/build_initial_collection.py --check
          python tools/build_expansion_collection.py --check
          python tools/build_atlas_collection.py --check
          python tools/build_continuum_collection.py --check
          python tools/build_club_collection.py --check
          python tools/build_dancefloor_collection.py --check
          python tools/build_default_catalogue.py --check
      - name: Install build-only tools and this checkout's native library
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld
          python -m pip install . playwright
          python -m playwright install --with-deps chromium
      - name: Generate the exact tagged native catalogue
        run: python tools/release_demo.py --version "$DEMO_VERSION" --commit "$DEMO_COMMIT" --output-dir dist/demo
      - name: Verify the full visualizer's MIDI transport
        run: python tools/test_midi_harness.py "dist/demo/DanceRudiments-demo-v$DEMO_VERSION.html"
      - name: Render, test, and package
        run: python tools/render_release_demo.py "dist/demo/DanceRudiments-demo-v$DEMO_VERSION.html"
      - name: Build and render the rhythm-and-audio audition page
        run: |
          python tools/build_club_demo.py --version "$DEMO_VERSION" --commit "$DEMO_COMMIT" --output "dist/demo/DanceRudiments-demo-club-v$DEMO_VERSION.html"
          python tools/render_club_demo.py "dist/demo/DanceRudiments-demo-club-v$DEMO_VERSION.html"
      - name: Build and render all beat mappings
        run: |
          python tools/build_dancefloor_demo.py --version "$DEMO_VERSION" --commit "$DEMO_COMMIT" --output "dist/demo/DanceRudiments-demo-dancefloor-v$DEMO_VERSION.html"
          python tools/render_dancefloor_demo.py "dist/demo/DanceRudiments-demo-dancefloor-v$DEMO_VERSION.html"
      - name: Stable self-contained visualizer download aliases
        run: |
          cp "dist/demo/DanceRudiments-demo-v$DEMO_VERSION.html" dist/demo/DanceRudiments-visualizer.html
          cp "dist/demo/DanceRudiments-demo-v$DEMO_VERSION.json" dist/demo/DanceRudiments-visualizer.json
          (cd dist/demo && sha256sum DanceRudiments-visualizer.html DanceRudiments-visualizer.json > DanceRudiments-visualizer.sha256)
      - uses: actions/upload-artifact@v6
        with:
          name: release-demo
          path: dist/demo/*
          if-no-files-found: error
  attach:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-demo
          path: demo
      - name: Attach to the existing release and verify uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            if [ "$attempt" = 60 ]; then
              echo "::error::GitHub Release $RELEASE_TAG was not created by release-tag.yml"
              exit 1
            fi
            sleep 2
          done
          (cd demo && sha256sum --check ./*.sha256)
          gh release upload "$RELEASE_TAG" demo/* --repo "$GITHUB_REPOSITORY" --clobber
          mkdir verified
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'DanceRudiments-demo-*' --dir verified
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'DanceRudiments-visualizer*' --dir verified
          (cd verified && sha256sum --check ./*.sha256)
