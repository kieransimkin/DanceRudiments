name: Release packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/release_version.py verify-tag "$GITHUB_REF_NAME"

  python-wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cibuildwheel==4.2.0
      - run: python -m cibuildwheel --output-dir wheelhouse
      - name: Verify wheel documentation and author links
        shell: bash
        run: python tools/check_package_docs.py --archive wheelhouse/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist
      - run: python tools/check_package_docs.py --archive dist/*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{wheels-*,python-sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    container: emscripten/emsdk:4.0.15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: emcmake cmake -S . -B build-wasm -DDANCERUDIMENTS_BUILD_WASM=ON -DDANCERUDIMENTS_BUILD_TESTS=OFF
      - run: cmake --build build-wasm --config Release
      - run: mkdir -p dist/wasm && cp build-wasm/dancerudiments.js build-wasm/dancerudiments.wasm dist/wasm/
      - name: Verify npm documentation and author links
        shell: bash
        run: |
          mkdir -p npm-package-check
          npm pack --ignore-scripts --pack-destination npm-package-check
          python3 tools/check_package_docs.py --archive npm-package-check/*.tgz
      - uses: actions/upload-artifact@v6
        with:
          name: npm-distribution
          path: npm-package-check/*.tgz
          if-no-files-found: error
      - run: npm publish ./npm-package-check/*.tgz --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cpp-archives:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and install
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="package/DanceRudiments-${VERSION}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDANCERUDIMENTS_BUILD_TESTS=OFF
          cmake --build build --config Release
          cmake --install build --config Release --prefix "$ROOT"
          cmake -E copy LICENSE "$ROOT/LICENSE"
          cmake -E copy packaging/CPP_BINARY_README.md "$ROOT/README.md"
          cmake -E echo "DanceRudiments ${VERSION}" > "$ROOT/PACKAGE-INFO.txt"
          cmake -E echo "Platform: ${{ matrix.label }}" >> "$ROOT/PACKAGE-INFO.txt"
          cmake -E echo "Architecture: ${{ runner.arch }}" >> "$ROOT/PACKAGE-INFO.txt"
          cmake -E echo "Library type: C++17 static library" >> "$ROOT/PACKAGE-INFO.txt"
          cmake -E echo "Author: Kieran Simkin" >> "$ROOT/PACKAGE-INFO.txt"
          cmake -E echo "Music: https://kieransimkin.co.uk/my-songs/" >> "$ROOT/PACKAGE-INFO.txt"
      - name: Create archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd package
          cmake -E tar cf "../DanceRudiments-cpp-${VERSION}-${{ matrix.label }}-static.zip" --format=zip "DanceRudiments-${VERSION}"
      - name: Verify native archive documentation and author links
        shell: bash
        run: python tools/check_package_docs.py --archive DanceRudiments-cpp-*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: cpp-${{ matrix.label }}
          path: DanceRudiments-cpp-*.zip
          if-no-files-found: error

  attach-github-release:
    needs: [cpp-archives, python-wheels, python-sdist, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "{cpp-*,wheels-*,python-sdist,npm-distribution}"
          path: release-assets
          merge-multiple: true
      - name: Write SHA-256 checksums
        working-directory: release-assets
        run: sha256sum *.zip *.whl *.tar.gz *.tgz > SHA256SUMS.txt
      - name: Wait for the tag preflight to create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..60}; do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::GitHub Release $GITHUB_REF_NAME was not created by release-tag.yml"
          exit 1
      - name: Attach verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.whl release-assets/*.tar.gz release-assets/*.tgz release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"

  publish-conan:
    needs: validate
    runs-on: ubuntu-latest
    environment: conan
    env:
      CONAN_REMOTE_URL: ${{ vars.CONAN_REMOTE_URL }}
      CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "conan>=2.20,<3"
      - run: conan profile detect --force
      - name: Build Conan package
        shell: bash
        run: conan create . --version "${GITHUB_REF_NAME#v}" --build=missing
      - name: Upload when a Conan remote is configured
        if: ${{ env.CONAN_REMOTE_URL != '' && env.CONAN_LOGIN_USERNAME != '' && env.CONAN_PASSWORD != '' }}
        run: |
          conan remote add release "$CONAN_REMOTE_URL" --force
          conan remote login release "$CONAN_LOGIN_USERNAME" --password "$CONAN_PASSWORD"
          conan upload "dancerudiments/*" --remote release --confirm
