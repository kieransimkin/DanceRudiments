[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "dancerudiments"
version = "0.1.3"
description = "Integer-pip rhythmic position functions with a C++ core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Kieran Simkin" }]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries"
]

[project.scripts]
dancerudiments-compile = "dancerudiments_authoring.cli:main"

[project.urls]
Homepage = "https://github.com/kieransimkin/DanceRudiments"
Repository = "https://github.com/kieransimkin/DanceRudiments"
Issues = "https://github.com/kieransimkin/DanceRudiments/issues"

[tool.scikit-build]
cmake.args = ["-DDANCERUDIMENTS_BUILD_PYTHON=ON", "-DDANCERUDIMENTS_BUILD_TESTS=OFF"]
wheel.packages = ["python/dancerudiments_authoring"]
sdist.include = ["CMakeLists.txt", "include/**", "src/**", "bindings/python/**", "python/**", "tools/**", "collections/initial/**", "harness/initial/**", "harness/initial-collection.html", ".gitattributes", "examples/patterns/**", "docs/authoring.md", "cmake/**", "tests/**"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
test-command = "python -c \"import dancerudiments as d; import dancerudiments_authoring as a; from dancerudiments_authoring.collections import initial_pack; assert len(initial_pack().patterns) == 28; assert hasattr(d, 'PatternLibrary'); assert len(d.catalogue()) == 15; assert d.sample('circle', 64).as_tuple() == d.sample('circle', 0).as_tuple()\""
