[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "dancerudiments"
version = "0.4.6"
description = "Deterministic rhythmic position functions with C++, Python, TypeScript/WASM and C# bindings. https://kieransimkin.co.uk/my-songs/"
readme = "README.md"
license = "MIT AND BSD-3-Clause AND CC0-1.0 AND CC-BY-4.0"
requires-python = ">=3.9"
authors = [{ name = "Kieran Simkin" }]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries"
]

[project.scripts]
dancerudiments-compile = "dancerudiments_authoring.cli:main"
dancerudiments-rig = "dancerudiments_authoring.motion_cli:main"
dancerudiments-motion-pack = "dancerudiments_authoring.motion_package_cli:main"

[project.optional-dependencies]
motion-import = ["numpy>=1.23,<3"]

[project.urls]
"DanceFlow ecosystem" = "https://kieransimkin.co.uk/danceflow/"
"Music / My Songs" = "https://kieransimkin.co.uk/my-songs/"
Homepage = "https://github.com/kieransimkin/DanceRudiments"
Repository = "https://github.com/kieransimkin/DanceRudiments"
Issues = "https://github.com/kieransimkin/DanceRudiments/issues"

[tool.scikit-build]
cmake.args = ["-DDANCERUDIMENTS_BUILD_PYTHON=ON", "-DDANCERUDIMENTS_BUILD_TESTS=OFF", "-DDANCERUDIMENTS_INSTALL_RIG_MOTION_EXAMPLES=OFF"]
wheel.packages = ["python/dancerudiments_authoring"]
# Root-only names must be anchored: otherwise they also include matching files
# inside ignored environments, caches and optional motion packages. Explicit
# includes override excludes, so negate caches and optional payloads here too.
sdist.include = ["/AGENTS.md", "/CONTRIBUTING.md", "/CMakeLists.txt", "include/**", "src/**", "bindings/python/**", "python/**", "tools/**", "collections/**", "harness/initial/**", "harness/initial-collection.html", "/.gitattributes", "examples/patterns/**", "examples/rig-motion/**", "examples/motion-packages/**", "docs/motion-packages.md", "docs/blender-motion-import.md", "motion-packages/**", "docs/rig-motion.md", "docs/rigify-catalogue.md", "docs/motion-sources.md", "docs/authoring.md", "docs/recordings.md", "docs/default-library.md", "docs/dancefloor.md", "docs/release-demo.md", "docs/mesh-demos.md", "docs/midi-harness.md", "cmake/**", "tests/**", "/README.md", "/AUTHORS.md", "packaging/**", "docs/images/**", "docs/branding/**", "docs/bindings.md", "docs/troubleshooting.md", "examples/bindings/**", "bindings/csharp/**", "docs/csharp.md", "!/motion-packs/**", "!/optional-motion-packs/**", "!/.cache/**", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]

# Do not ship hand-off patches, credentials, interpreter caches, or local example output in sdists.
sdist.exclude = ["examples/rig-motion/**", "motion-packs/**", "optional-motion-packs/**", ".cache/**", "*.patch", "npm_recovery_codes.txt", "**/__pycache__/**", "**/*.pyc", "**/*.pyo", "examples/bindings/typescript/dist/**", "bindings/csharp/**/bin/**", "bindings/csharp/**/obj/**", "tests/csharp/**/bin/**", "tests/csharp/**/obj/**", "examples/bindings/csharp/bin/**", "examples/bindings/csharp/obj/**"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32"
test-command = "python -c \"import dancerudiments as d; import dancerudiments_authoring as a; from dancerudiments_authoring.collections import initial_pack, expansion_pack, atlas_pack, continuum_pack, club_pack, dancefloor_pack; assert len(initial_pack().patterns) == 28; assert len(expansion_pack().patterns) == 24; assert len(atlas_pack().patterns) == 256; assert len(continuum_pack().patterns) == 320; assert len(club_pack().patterns) == 144; assert len(dancefloor_pack().patterns) == 944; assert hasattr(d, 'PatternLibrary'); assert len(d.catalogue()) == 1731; assert d.sample('circle', 64).as_tuple() == d.sample('circle', 0).as_tuple()\""
